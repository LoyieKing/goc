name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Builds the patched Clang and the goc passes once per push and caches them.
  #
  # Two caches, two keys. The Clang key covers only what goes into Clang (its
  # patches, SemaGocColors and the build scripts). The old single key also
  # hashed llvm/**, so any pass change threw away the ~1.5 h Clang build.
  # The pass key adds llvm/** on top of the Clang key; a pass change rebuilds
  # only build/llvm (minutes).
  #
  # On a Clang miss, ccache (restored by prefix from the newest earlier run)
  # makes the rebuild recompile only what a patch touches.
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "1"
      GOC_CCACHE: "1"
    outputs:
      clang-key: ${{ steps.keys.outputs.clang }}
      passes-key: ${{ steps.keys.outputs.passes }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache keys
        id: keys
        env:
          CLANG_KEY: goc-clang-19.1.7-r3-${{ hashFiles('clang/patches/**', 'clang/sema/**', 'scripts/build-clang.sh', 'scripts/apply-patches.sh', 'scripts/slim-clang-build.sh') }}
          PASSES_KEY: goc-passes-r1-${{ hashFiles('clang/patches/**', 'clang/sema/**', 'scripts/build-clang.sh', 'scripts/apply-patches.sh', 'scripts/slim-clang-build.sh') }}-${{ hashFiles('llvm/**', 'scripts/build-passes.sh') }}
        run: |
          echo "clang=$CLANG_KEY" >>"$GITHUB_OUTPUT"
          echo "passes=$PASSES_KEY" >>"$GITHUB_OUTPUT"
          echo "clang=$CLANG_KEY passes=$PASSES_KEY"

      - name: Restore patched clang
        id: clang
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/llvm-19.1.7-clang-build/bin
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so.19.1
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so
            third_party/llvm-19.1.7-clang-build/lib/libclang-cpp.so*
            third_party/llvm-19.1.7-clang-build/lib/clang
            third_party/llvm-19.1.7-clang-build/lib/Target/X86
            third_party/llvm-19.1.7-clang-build/x86-src
          key: ${{ steps.keys.outputs.clang }}

      - name: Restore passes
        id: passes
        uses: actions/cache/restore@v4
        with:
          path: |
            build/llvm/goc-llc
            build/llvm/libGocPasses.so
          key: ${{ steps.keys.outputs.passes }}

      - name: Install build tools
        if: steps.clang.outputs.cache-hit != 'true' || steps.passes.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache \
            curl xz-utils zlib1g-dev
          if ! command -v clang-19 >/dev/null 2>&1; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 19
          fi

      # Prefix fallback: an exact key never matches (run_id), the newest
      # entry of the same kind is restored and ccache reuses what still fits.
      - name: Restore ccache
        if: steps.clang.outputs.cache-hit != 'true' || steps.passes.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: goc-ccache-r1-${{ github.run_id }}
          restore-keys: goc-ccache-r1-

      - name: Build clang
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          ccache -z
          ./scripts/build-clang.sh
          ./scripts/slim-clang-build.sh
          ccache -s

      - name: Save patched clang
        if: steps.clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/llvm-19.1.7-clang-build/bin
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so.19.1
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so
            third_party/llvm-19.1.7-clang-build/lib/libclang-cpp.so*
            third_party/llvm-19.1.7-clang-build/lib/clang
            third_party/llvm-19.1.7-clang-build/lib/Target/X86
            third_party/llvm-19.1.7-clang-build/x86-src
          key: ${{ steps.keys.outputs.clang }}

      - name: Build passes
        if: steps.passes.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-passes.sh
          ccache -s

      - name: Save passes
        if: steps.passes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/llvm/goc-llc
            build/llvm/libGocPasses.so
          key: ${{ steps.keys.outputs.passes }}

      # Saved even when a later build step fails, so the next run resumes.
      - name: Save ccache
        if: always() && (steps.clang.outputs.cache-hit != 'true' || steps.passes.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: goc-ccache-r1-${{ github.run_id }}

  test:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every supported Go release is required (docs/multi-go-version.md).
    # One gocobj2goobj serves them all from the facts in gometa/data; the
    # toolchain job above does not depend on Go.
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "1.24.4", "1.25.x", "1.26.x", "1.27.x"]
    env:
      GOTOOLCHAIN: local
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            ripgrep curl ca-certificates xz-utils patchelf pkg-config \
            zlib1g-dev lld \
            qemu-user libc6-dev-arm64-cross linux-libc-dev-arm64-cross
          if ! command -v clang-19 >/dev/null 2>&1; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 19
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Restore patched clang
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/llvm-19.1.7-clang-build/bin
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so.19.1
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so
            third_party/llvm-19.1.7-clang-build/lib/libclang-cpp.so*
            third_party/llvm-19.1.7-clang-build/lib/clang
            third_party/llvm-19.1.7-clang-build/lib/Target/X86
            third_party/llvm-19.1.7-clang-build/x86-src
          key: ${{ needs.toolchain.outputs.clang-key }}
          fail-on-cache-miss: true

      - name: Restore passes
        uses: actions/cache/restore@v4
        with:
          path: |
            build/llvm/goc-llc
            build/llvm/libGocPasses.so
          key: ${{ needs.toolchain.outputs.passes-key }}
          fail-on-cache-miss: true

      - name: Test
        run: |
          # p27 builds libGocClang.so with the host clang++-19. That package
          # does not ship llvm-config-19 or the Clang C++ headers.
          sudo apt-get install -y llvm-19-dev libclang-19-dev llvm-19-tools
          pipx install lit==23.1.3   # pinned (tested); Ubuntu 24.04 pip refuses system-wide installs
          command -v llvm-config-19 >/dev/null
          inc="$(llvm-config-19 --includedir)"
          test -f "$inc/clang/Frontend/FrontendPluginRegistry.h"
          go version
          ARM64_REQUIRE_QEMU=1 GOC_REQUIRE_LIT=1 ./scripts/ci-test.sh

      # The release facts gocobj2goobj embeds must be what the resolver reads
      # from this GOROOT (a newer patch release may only change
      # source_version; any other change needs review: docs/go-metadata-schema.md).
      - name: gometa/data is what the resolver reads
        run: |
          m="$(go env GOVERSION | cut -d. -f1,2)"
          go run ./tools/golangc-metadata-resolver -o "$RUNNER_TEMP/$m.json"
          diff <(jq 'del(.source_version)' "gometa/data/$m.json") <(jq 'del(.source_version)' "$RUNNER_TEMP/$m.json")
