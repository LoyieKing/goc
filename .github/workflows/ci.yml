name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain.yml

  test:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every supported Go release is required (docs/design/go-versions.md).
    # One goc tool convert serves them all from the facts in internal/gometa/data; the
    # toolchain job above does not depend on Go. The repository's tools need
    # go1.23 to build: for an older release a second Go builds them
    # (GOC_HOST_GO).
    strategy:
      fail-fast: false
      matrix:
        go: ["1.18.x", "1.19.x", "1.20.x", "1.21.x", "1.22.x", "1.23.x", "1.24.4", "1.25.x", "1.26.x", "1.27.x"]
        include:
          - {go: "1.18.x", host-go: "1.27.x"}
          - {go: "1.19.x", host-go: "1.27.x"}
          - {go: "1.20.x", host-go: "1.27.x"}
          - {go: "1.21.x", host-go: "1.27.x"}
          - {go: "1.22.x", host-go: "1.27.x"}
    env:
      GOTOOLCHAIN: local
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4

      - name: Disk usage (start)
        run: df -h /

      # One apt-get update and only what the runner image lacks:
      # build-essential, cmake, python3, curl, xz, pkg-config and zlib come
      # with ubuntu-24.04. LLVM 19 comes from apt.llvm.org without llvm.sh,
      # which would also pull lldb, clangd and clang-tools (~150 MB).
      # LLVM 19's opt, FileCheck and not run the color-escape and lit tests
      # against the cached libGocPasses.so; the C is compiled by the patched clang.
      - name: Install host tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename="$(lsb_release -cs)"
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ripgrep patchelf lld \
            qemu-user libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            llvm-19-dev llvm-19-tools
          pipx install lit==23.1.3   # pinned (tested); Ubuntu 24.04 pip refuses system-wide installs
          command -v llvm-config-19 >/dev/null

      - name: Set up host Go (builds the repository's tools)
        if: matrix.host-go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.host-go }}
          cache: false

      - name: GOC_HOST_GO
        if: matrix.host-go
        run: echo "GOC_HOST_GO=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod   # no go.sum: the module has no dependencies

      - name: Restore patched clang
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/llvm-19.1.7-clang-build/bin
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so.19.1
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so
            third_party/llvm-19.1.7-clang-build/lib/libclang-cpp.so*
            third_party/llvm-19.1.7-clang-build/lib/clang
            third_party/llvm-19.1.7-clang-build/lib/Target/X86
            third_party/llvm-19.1.7-clang-build/x86-src
            third_party/llvm-19.1.7-clang-build/include
            third_party/llvm-19.1.7-clang-build/lib/cmake/llvm
            third_party/llvm-project-19.1.7/llvm/include
            third_party/llvm-project-19.1.7/llvm/cmake
          key: ${{ needs.toolchain.outputs.clang-key }}
          fail-on-cache-miss: true

      - name: Restore passes
        uses: actions/cache/restore@v4
        with:
          path: |
            build/llvm/goc-llc
            build/llvm/libGocPasses.so
          key: ${{ needs.toolchain.outputs.passes-key }}
          fail-on-cache-miss: true

      - name: Test
        run: |
          go version
          ARM64_REQUIRE_QEMU=1 GOC_REQUIRE_LIT=1 ./scripts/ci-test.sh

      # The release facts goc tool convert embeds must be what the resolver reads
      # from this GOROOT (a newer patch release may only change
      # source_version; any other change needs review: docs/design/go-versions.md §12).
      - name: internal/gometa/data is what the resolver reads
        run: |
          m="$(go env GOVERSION | cut -d. -f1,2)"
          "${GOC_HOST_GO:-go}" run ./cmd/goc-gometa -goroot "$(go env GOROOT)" -o "$RUNNER_TEMP/$m.json"
          diff <(jq 'del(.source_version)' "internal/gometa/data/$m.json") <(jq 'del(.source_version)' "$RUNNER_TEMP/$m.json")

      - name: Disk usage (end)
        if: always()
        run: df -h /

  # QuickJS-ng on goroutine stacks: the real C program goc is checked on.
  # ports/quickjs/build.sh compiles the engine and the host with goc, runs the
  # moving-stack smoke (embed) and links qjscli; then the ng tests.conf suite.
  # test262, the Bellard tests and the V8 benchmark stay local (docs/contributing.md §2).
  qjs-smoke:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      QJS_NG_VERSION: "0.17.0"
      QJS_NG_SHA256: 559bc4c420475e55c7ab4510adbc562f55d7524d75e8e89d79ce4bb02f5687d9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache-dependency-path: go.mod

      - name: Restore patched clang
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/llvm-19.1.7-clang-build/bin
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so.19.1
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so
            third_party/llvm-19.1.7-clang-build/lib/libclang-cpp.so*
            third_party/llvm-19.1.7-clang-build/lib/clang
            third_party/llvm-19.1.7-clang-build/lib/Target/X86
            third_party/llvm-19.1.7-clang-build/x86-src
            third_party/llvm-19.1.7-clang-build/include
            third_party/llvm-19.1.7-clang-build/lib/cmake/llvm
            third_party/llvm-project-19.1.7/llvm/include
            third_party/llvm-project-19.1.7/llvm/cmake
          key: ${{ needs.toolchain.outputs.clang-key }}
          fail-on-cache-miss: true

      - name: Restore passes
        uses: actions/cache/restore@v4
        with:
          path: |
            build/llvm/goc-llc
            build/llvm/libGocPasses.so
          key: ${{ needs.toolchain.outputs.passes-key }}
          fail-on-cache-miss: true

      - name: Fetch QuickJS-ng
        run: |
          curl -sSL --fail -o "$RUNNER_TEMP/ng.tgz" \
            "https://github.com/quickjs-ng/quickjs/archive/refs/tags/v$QJS_NG_VERSION.tar.gz"
          echo "$QJS_NG_SHA256  $RUNNER_TEMP/ng.tgz" | sha256sum -c -
          tar -C third_party -xzf "$RUNNER_TEMP/ng.tgz"
          mv "third_party/quickjs-$QJS_NG_VERSION" third_party/quickjs-ng

      - name: Build (engine, host, embed smoke, qjscli)
        run: ./ports/quickjs/build.sh

      - name: tests.conf suite
        run: |
          echo 'print("goc qjs " + (6 * 7))' > "$RUNNER_TEMP/smoke.js"
          build/qjs/qjscli --script "$RUNNER_TEMP/smoke.js" | tee "$RUNNER_TEMP/smoke.out"
          grep -qx 'goc qjs 42' "$RUNNER_TEMP/smoke.out"
          python3 ports/quickjs/tests/cli_tests.py
