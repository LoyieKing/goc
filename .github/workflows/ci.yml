name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The pinned Go is what the vendored goobj writer and
    # tools/gocobj2goobj/gover_go1_24.go are for. The next release runs as an
    # early warning: it is expected to fail until its gover file and ABI
    # profile exist, and does not fail the workflow.
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: "1.24.4"
            experimental: false
          - go: "1.25.x"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            ripgrep curl ca-certificates xz-utils patchelf pkg-config \
            zlib1g-dev lld \
            qemu-user libc6-dev-arm64-cross linux-libc-dev-arm64-cross
          if ! command -v clang-19 >/dev/null 2>&1; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 19
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # restore + save, not actions/cache. The combined action only writes
      # the cache when the whole job succeeds, so a test failure used to
      # throw away the Clang build.
      - name: Restore patched clang and passes
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/llvm-19.1.7-clang-build/bin
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so.19.1
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so
            third_party/llvm-19.1.7-clang-build/lib/libclang-cpp.so*
            third_party/llvm-19.1.7-clang-build/lib/clang
            third_party/llvm-19.1.7-clang-build/lib/Target/X86
            third_party/llvm-19.1.7-clang-build/x86-src
            build/llvm/goc-color-escape
            build/llvm/goc-llc
            build/llvm/libGocPasses.so
          key: goc-clang-19.1.7-r2-${{ hashFiles('clang/patches/**', 'clang/sema/**', 'scripts/build-clang.sh', 'scripts/build-passes.sh', 'scripts/apply-patches.sh', 'llvm/lib/Transforms/ColorEscape/**', 'llvm/**') }}

      - name: Build clang and passes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-clang.sh
          ./scripts/build-passes.sh
          ./scripts/slim-clang-build.sh

      - name: Save patched clang and passes
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/llvm-19.1.7-clang-build/bin
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so.19.1
            third_party/llvm-19.1.7-clang-build/lib/libLLVM.so
            third_party/llvm-19.1.7-clang-build/lib/libclang-cpp.so*
            third_party/llvm-19.1.7-clang-build/lib/clang
            third_party/llvm-19.1.7-clang-build/lib/Target/X86
            third_party/llvm-19.1.7-clang-build/x86-src
            build/llvm/goc-color-escape
            build/llvm/goc-llc
            build/llvm/libGocPasses.so
          key: goc-clang-19.1.7-r2-${{ hashFiles('clang/patches/**', 'clang/sema/**', 'scripts/build-clang.sh', 'scripts/build-passes.sh', 'scripts/apply-patches.sh', 'llvm/lib/Transforms/ColorEscape/**', 'llvm/**') }}

      - name: Test
        run: |
          # p27 builds libGocClang.so with the host clang++-19. That package
          # does not ship llvm-config-19 or the Clang C++ headers.
          sudo apt-get install -y llvm-19-dev libclang-19-dev llvm-19-tools
          pipx install lit==23.1.3   # pinned (tested); Ubuntu 24.04 pip refuses system-wide installs
          command -v llvm-config-19 >/dev/null
          inc="$(llvm-config-19 --includedir)"
          test -f "$inc/clang/Frontend/FrontendPluginRegistry.h"
          ARM64_REQUIRE_QEMU=1 GOC_REQUIRE_LIT=1 ./scripts/ci-test.sh
